name: Site bug
description: Something broken or unreadable on the site.
title: "[site] "
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "the fork page on iPhone" · "Overview on Safari"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
